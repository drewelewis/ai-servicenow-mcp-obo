# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ai-servicenow-mcp-obo
metadata:
  template: ai-servicenow-mcp-obo@0.1.0

hooks:
  preprovision:
    run: ./scripts/azd-preprovision.js
    interactive: true
    continueOnError: false

services:
  mcp:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
